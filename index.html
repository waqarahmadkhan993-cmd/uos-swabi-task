<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | University of Swabi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <header class="top-header">
        <div class="brand">
            <div class="logo">UOS</div>
            <div>
                <h1>University of Swabi</h1>
                <p>Knowledge • Excellence • Innovation</p>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">🎓</div>
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to your student account</p>

            <form action="dashboard.html" method="get">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                    name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                    name="password" placeholder="Enter your password"
                    minlength="6" required>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="signup.html">Need an account?</a>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <p class="switch-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
            <a href="dashboard.html" class="demo-link">
                Preview Dashboard
            </a>
        </section>
    </main>

    <footer class="footer">
        © 2026 University of Swabi | Student Portal Demo
    </footer>

</body>
</html>
